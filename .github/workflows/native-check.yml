name: Validate native app

on:
  pull_request:
    paths:
      - "assets/**"
      - "content/**"
      - "js/**"
      - "scripts/**"
      - "src-tauri/**"
      - ".github/workflows/native-*.yml"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "sw.js"
  push:
    branches: [main]
    paths:
      - "assets/**"
      - "content/**"
      - "js/**"
      - "scripts/**"
      - "src-tauri/**"
      - ".github/workflows/native-*.yml"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "sw.js"

permissions:
  contents: read

concurrency:
  group: native-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install exact frontend dependencies
        run: npm ci

      - name: Run content and native audits
        run: npm test

      - name: Prepare deterministic frontend bundle
        run: npm run native:prepare

      - name: Compile-check the Tauri application
        run: cargo check --manifest-path src-tauri/Cargo.toml
