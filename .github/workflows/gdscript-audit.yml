name: Audit Code Library GDScript

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parse-gdscript:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7.1
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Export every Code Library script
        run: node scripts/export-gdscript-audit.mjs
      - name: Download official Godot editor
        run: |
          curl --fail --location --retry 3 \
            --output /tmp/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
      - name: Parse every GDScript with Godot 4.7.1
        shell: bash
        run: |
          set -o pipefail
          "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" \
            --headless --editor --path build/gdscript-audit --quit-after 20 \
            2>&1 | tee build/gdscript-audit.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Cannot get class" build/gdscript-audit.log; then
            exit 1
          fi
      - name: Preload the complete script catalogue
        shell: bash
        run: |
          set -o pipefail
          "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" \
            --headless --path build/gdscript-audit --quit-after 2 \
            2>&1 | tee build/gdscript-runtime.log
          grep -F "Loaded 113 Code Library scripts." build/gdscript-runtime.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Cannot get class" build/gdscript-runtime.log; then
            exit 1
          fi
